spring.application.name=voyago-backend

# Server Configuration (Railway PORT support with local 8080 fallback)
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/voyago_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# Security Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Weather Configuration (Open-Meteo)
weather.open-meteo.geocoding-url=${WEATHER_GEOCODING_URL:https://geocoding-api.open-meteo.com/v1/search}
weather.open-meteo.forecast-url=${WEATHER_FORECAST_URL:https://api.open-meteo.com/v1/forecast}

# Places Configuration (Wikipedia MediaWiki API)
places.wikipedia.api-url=${PLACES_WIKIPEDIA_API_URL:https://en.wikipedia.org/w/api.php}

# Maps & Routing Configuration (Open-Meteo Geocoding & OSRM Routing)
maps.geocoding.base-url=${MAPS_GEOCODING_URL:https://geocoding-api.open-meteo.com/v1/search}
maps.routing.base-url=${MAPS_ROUTING_URL:https://router.project-osrm.org/route/v1/driving}

# Frontend Application Configuration
app.frontend-url=${FRONTEND_URL:http://localhost:5173}


